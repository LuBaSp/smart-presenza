<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart o Presenza</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lavoro">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: una colonna da telefono bloccata a schermo intero (niente scroll) — data di oggi, due grandi tasti, riepilogo del mese, calendario che si adatta allo spazio rimasto. */
:root {
  --bg: #F2F3F7;
  --surface: #FFFFFF;
  --fg: #171923;
  --muted: #6B7084;
  --line: #E2E4EC;
  --smart: #4F46E5;
  --smart-soft: #E7E6FC;
  --pres: #E07A1F;
  --pres-soft: #FCEBDB;
  --trip: #0D8574;
  --trip-soft: #D7F0EB;
  --off: #C43D72;
  --off-soft: #FBE3EC;
  --on-accent: #FFFFFF;
  --shadow: 0 1px 2px rgba(23,25,35,.05), 0 8px 24px rgba(23,25,35,.06);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101218; --surface: #1A1D26; --fg: #EEF0F6; --muted: #8C91A6; --line: #2A2E3B;
    --smart: #8B85FF; --smart-soft: #2A2850; --pres: #F59E4C; --pres-soft: #3D2A1A;
    --trip: #2EC4AE; --trip-soft: #13383A;
    --off: #F27AA8; --off-soft: #3D1E2B;
    --on-accent: #101218;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed; inset: 0;
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body);
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
main { height: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(8px, 1.4dvh, 16px); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--smart); outline-offset: 3px; }

header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 4px; flex: none; }
.head-main { min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h1 { font: 800 clamp(22px, 3.4dvh, 30px)/1.05 var(--display); margin: 4px 0 0; letter-spacing: -.02em; text-wrap: balance; }
.week { font-size: 13px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.head-side { display: flex; align-items: center; gap: 2px; flex: none; margin-right: -8px; }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:active { background: var(--line); }
.icon-btn svg { width: 20px; height: 20px; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none; }
/* Tasti di oggi: icona in un "badge" tondo al centro, nome sotto. Ogni tasto ha il suo colore in --c / --c-soft */
.choice[data-mode="smart"] { --c: var(--smart); --c-soft: var(--smart-soft); }
.choice[data-mode="presenza"] { --c: var(--pres); --c-soft: var(--pres-soft); }
.choice {
  position: relative; overflow: hidden; height: clamp(96px, 14.5dvh, 150px); border-radius: 24px; padding: 12px;
  background: linear-gradient(165deg, var(--surface) 45%, color-mix(in srgb, var(--c) 9%, var(--surface)));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 14%, transparent), var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(6px, 1.1dvh, 10px);
  transition: transform .15s ease, box-shadow .3s ease, color .25s ease;
}
/* Il colore pieno è un livello sopra lo sfondo che appare in dissolvenza (i gradienti non si animano) */
.choice::before {
  content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .3s ease;
  background:
    radial-gradient(120% 90% at 15% 0%, rgba(255,255,255,.28), transparent 55%),
    linear-gradient(155deg, var(--c), color-mix(in srgb, var(--c) 78%, #000));
}
.choice > * { position: relative; }
.choice:active { transform: scale(.97); }
.choice .badge {
  width: clamp(40px, 6dvh, 56px); height: clamp(40px, 6dvh, 56px); border-radius: 50%;
  display: grid; place-items: center; background: var(--c-soft); color: var(--c);
  transition: background-color .3s ease, color .3s ease, transform .35s cubic-bezier(.3,1.6,.5,1);
}
.choice .badge svg { width: 55%; height: 55%; }
.choice .name { font: 700 clamp(18px, 2.6dvh, 22px)/1 var(--display); letter-spacing: -.01em; }
.choice.on { color: var(--on-accent); box-shadow: 0 12px 28px -10px color-mix(in srgb, var(--c) 70%, transparent), var(--shadow); }
.choice.on::before { opacity: 1; }
.choice.on .badge { background: color-mix(in srgb, var(--on-accent) 20%, transparent); color: var(--on-accent); transform: scale(1.06); }
.choice .check {
  position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; background: var(--on-accent); color: var(--c); opacity: 0; transform: scale(.5);
  transition: opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1);
}
.choice .check svg { width: 13px; height: 13px; }
.choice.on .check { opacity: 1; transform: none; }

/* Riga sotto i due tasti: Trasferta e Altro. Quello aperto si allarga e mostra le sue due opzioni, l'altro si riduce alla sola icona */
.extras { grid-column: 1 / -1; display: flex; gap: 10px; }
.pill {
  flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 4px;
  border-radius: 18px;
  background: linear-gradient(165deg, var(--surface) 45%, color-mix(in srgb, var(--c) 9%, var(--surface)));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 14%, transparent), var(--shadow);
  transition: flex .3s ease, box-shadow .3s ease, color .25s ease;
}
#trip { --c: var(--trip); --c-soft: var(--trip-soft); }
#other { --c: var(--off); --c-soft: var(--off-soft); }
.pill.mini { flex: 0 0 56px; }
.pill.on {
  color: var(--on-accent);
  background: radial-gradient(120% 140% at 10% 0%, rgba(255,255,255,.22), transparent 55%), linear-gradient(155deg, var(--c), color-mix(in srgb, var(--c) 78%, #000));
  box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--c) 70%, transparent), var(--shadow);
}
.pill-btn { flex: 1; min-width: 0; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 6px; transition: transform .15s ease; }
.pill-btn:active { transform: scale(.98); }
.pill-btn .badge { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--c-soft); color: var(--c); transition: background-color .3s ease, color .3s ease; }
.pill-btn .badge svg { width: 17px; height: 17px; }
.pill-btn .name { font: 700 16px/1 var(--display); white-space: nowrap; }
.pill.mini .name { display: none; }
.pill.on .pill-btn .badge { background: color-mix(in srgb, var(--on-accent) 20%, transparent); color: var(--on-accent); }
.kind { flex: none; display: flex; padding: 3px; border-radius: 12px; background: var(--bg); }
.kind button { padding: 6px 10px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--c); }
.pill.on .kind { background: color-mix(in srgb, var(--on-accent) 22%, transparent); }
.pill.on .kind button { color: var(--on-accent); }
.pill.on .kind button.on { background: var(--on-accent); color: var(--c); }

.summary { display: flex; flex-direction: column; gap: 8px; flex: none; }
.legend { display: flex; justify-content: space-between; gap: 6px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend svg { width: 16px; height: 16px; }
.legend .s { color: var(--smart); } .legend .p { color: var(--pres); } .legend .t { color: var(--trip); } .legend .o { color: var(--off); }
.legend b { color: var(--fg); }
.bar { height: 8px; border-radius: 99px; background: var(--line); display: flex; overflow: hidden; }
.bar span { transition: width .4s ease; }
.bar .s { background: var(--smart); } .bar .p { background: var(--pres); } .bar .t { background: var(--trip); } .bar .o { background: var(--off); }

.cal {
  flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--surface); border-radius: 24px; padding: 12px 14px 14px; box-shadow: var(--shadow);
}
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px; flex: none; }
.cal-head h2 { font: 700 19px/1 var(--display); margin: 0; text-transform: capitalize; }
.nav { display: flex; gap: 4px; }
.nav button { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
.nav button:active { background: var(--line); }
.nav svg { width: 18px; height: 18px; }
/* Le righe delle settimane si dividono lo spazio rimasto (max 52px), così il calendario non fa mai scorrere la pagina */
.grid { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto; grid-auto-rows: minmax(0, 52px); align-content: start; gap: 4px; }
.dow { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); padding-bottom: 4px; }
.day {
  min-height: 0; border-radius: 12px; display: grid; place-items: center;
  font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; position: relative;
}
.day.empty { pointer-events: none; }
.day.we { color: var(--muted); opacity: .55; }
.day.smart { background: var(--smart-soft); color: var(--smart); opacity: 1; font-weight: 800; }
.day.presenza { background: var(--pres-soft); color: var(--pres); opacity: 1; font-weight: 800; }
.day.trasferta, .day.estero { background: var(--trip-soft); color: var(--trip); opacity: 1; font-weight: 800; }
.day.ferie, .day.malattia { background: var(--off-soft); color: var(--off); opacity: 1; font-weight: 800; }
.day.estero::after, .day.malattia::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
.day.today { box-shadow: inset 0 0 0 2px var(--fg); }
.day.sel { box-shadow: inset 0 0 0 2px var(--muted); }
.day:active { transform: scale(.92); }

/* Barra di modifica sempre presente sotto il calendario: occupa uno spazio fisso, così niente si sposta quando tocchi un giorno */
.editor {
  flex: none; display: flex; align-items: center; gap: 4px; margin-top: 12px; padding: 5px 5px 5px 12px;
  border-radius: 14px; background: var(--bg);
}
.editor .when { flex: 1; min-width: 0; line-height: 1.2; }
.editor .when b { display: block; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.editor .when span { display: block; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.editor button { flex: none; width: 36px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); transition: opacity .2s; }
.editor button svg { width: 20px; height: 20px; }
.editor button:disabled { opacity: .35; cursor: default; }
.editor button.s { color: var(--smart); } .editor button.p { color: var(--pres); }
.editor button.s.on { background: var(--smart); color: var(--on-accent); }
.editor button.p.on { background: var(--pres); color: var(--on-accent); }
.editor button.t { color: var(--trip); }
.editor button.t.on { background: var(--trip); color: var(--on-accent); }
.editor button.o { color: var(--off); }
.editor button.o.on { background: var(--off); color: var(--on-accent); }

footer { display: flex; justify-content: center; gap: 18px; flex: none; font-size: 13px; color: var(--muted); }
footer button { color: var(--muted); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* Impostazioni: finestra modale con nome e cognome */
.sheet {
  width: min(400px, calc(100% - 32px)); border: 0; border-radius: 24px; padding: 20px;
  background: var(--surface); color: var(--fg); box-shadow: var(--shadow);
}
.sheet::backdrop { background: rgba(10,12,18,.45); }
.sheet h2 { font: 700 20px/1.1 var(--display); margin: 0 0 16px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field span { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input {
  font: 600 16px/1.2 var(--body); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%;
}
.field input:focus { outline: 2px solid var(--smart); outline-offset: 1px; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.sheet-actions button { padding: 10px 16px; border-radius: 12px; font-weight: 700; }
.sheet-actions .primary { background: var(--smart); color: var(--on-accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px;
  font-weight: 700; font-size: 14px; transition: opacity .2s, transform .25s; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="head-main">
      <div class="eyebrow" id="hello">Oggi</div>
      <h1 id="today"></h1>
    </div>
    <div class="head-side">
      <div class="week" id="week"></div>
      <button class="icon-btn" id="settingsBtn" aria-label="Impostazioni" title="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </header>

  <section class="choices" aria-label="Modalità di oggi">
    <button class="choice" id="btnSmart" data-mode="smart" aria-pressed="false">
      <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><rect x="9" y="13" width="6" height="4" rx="1"/></svg></span>
      <div class="name">Smart</div>
    </button>
    <button class="choice" id="btnPres" data-mode="presenza" aria-pressed="false">
      <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h1.5M13.5 7H15M9 11h1.5M13.5 11H15M10.5 21v-4h3v4"/></svg></span>
      <div class="name">Presenza</div>
    </button>
    <div class="extras">
      <div class="pill" id="trip">
        <button class="pill-btn" id="btnTrip" aria-pressed="false"><span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span><span class="name">Trasferta</span></button>
        <div class="kind" id="tripKind" role="group" aria-label="Tipo di trasferta" hidden>
          <button data-kind="trasferta" aria-pressed="false">Italia</button>
          <button data-kind="estero" aria-pressed="false">Estero</button>
        </div>
      </div>
      <div class="pill" id="other">
        <button class="pill-btn" id="btnOther" aria-pressed="false" aria-expanded="false"><span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></span><span class="name">Altro</span></button>
        <div class="kind" id="otherKind" role="group" aria-label="Ferie o malattia" hidden>
          <button data-kind="ferie" aria-pressed="false">Ferie</button>
          <button data-kind="malattia" aria-pressed="false">Malattia</button>
        </div>
      </div>
    </div>
  </section>

  <section class="summary" aria-label="Riepilogo del mese">
    <div class="legend">
      <span class="s" title="smart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><rect x="9" y="13" width="6" height="4" rx="1"/></svg><b id="cntS">0</b></span>
      <span class="p" title="presenza"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h1.5M13.5 7H15M9 11h1.5M13.5 11H15M10.5 21v-4h3v4"/></svg><b id="cntP">0</b></span>
      <span class="t" title="trasferte in Italia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17H3.5a.5.5 0 0 1-.5-.5V13a2 2 0 0 1 1.4-1.9L6 10.5l2.3-3.6A2 2 0 0 1 10 6h4.6a2 2 0 0 1 1.6.8l2.8 3.7 1.6.5A2 2 0 0 1 22 13v3.5a.5.5 0 0 1-.5.5H19"/><path d="M9 17h6M6 10.5h13M12.5 6v4.5"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg><b id="cntT">0</b></span>
      <span class="t" title="trasferte all'estero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg><b id="cntE">0</b></span>
      <span class="o" title="ferie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg><b id="cntF">0</b></span>
      <span class="o" title="malattia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.76V4.5a2 2 0 0 0-4 0v10.26a4 4 0 1 0 4 0z"/><path d="M12 11v6"/></svg><b id="cntM">0</b></span>
    </div>
    <div class="bar"><span class="s" id="barS" style="width:0"></span><span class="p" id="barP" style="width:0"></span><span class="t" id="barT" style="width:0"></span><span class="o" id="barO" style="width:0"></span></div>
  </section>

  <section class="cal" aria-label="Calendario">
    <div class="cal-head">
      <h2 id="monthLabel"></h2>
      <div class="nav">
        <button id="prev" aria-label="Mese precedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="next" aria-label="Mese successivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="editor" id="editor" role="group" aria-label="Modifica giorno">
      <span class="when"><span id="editDow">Scegli</span><b id="editWhen">un giorno</b></span>
      <button class="s" data-set="smart" aria-label="Smart" title="Smart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><rect x="9" y="13" width="6" height="4" rx="1"/></svg></button>
      <button class="p" data-set="presenza" aria-label="Presenza" title="Presenza"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h1.5M13.5 7H15M9 11h1.5M13.5 11H15M10.5 21v-4h3v4"/></svg></button>
      <button class="t" data-set="trasferta" aria-label="Trasferta in Italia" title="Trasferta in Italia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17H3.5a.5.5 0 0 1-.5-.5V13a2 2 0 0 1 1.4-1.9L6 10.5l2.3-3.6A2 2 0 0 1 10 6h4.6a2 2 0 0 1 1.6.8l2.8 3.7 1.6.5A2 2 0 0 1 22 13v3.5a.5.5 0 0 1-.5.5H19"/><path d="M9 17h6M6 10.5h13M12.5 6v4.5"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg></button>
      <button class="t" data-set="estero" aria-label="Trasferta all'estero" title="Trasferta all'estero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></button>
      <button class="o" data-set="ferie" aria-label="Ferie" title="Ferie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg></button>
      <button class="o" data-set="malattia" aria-label="Malattia" title="Malattia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.76V4.5a2 2 0 0 0-4 0v10.26a4 4 0 1 0 4 0z"/><path d="M12 11v6"/></svg></button>
    </div>
  </section>

  <footer>
    <button id="exportBtn">Esporta backup</button>
    <button id="importBtn">Importa backup</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

<dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
  <form method="dialog" id="settingsForm">
    <h2 id="settingsTitle">Impostazioni</h2>
    <label class="field"><span>Nome</span><input id="nome" autocomplete="given-name" autocapitalize="words" spellcheck="false"></label>
    <label class="field"><span>Cognome</span><input id="cognome" autocomplete="family-name" autocapitalize="words" spellcheck="false"></label>
    <div class="sheet-actions">
      <button type="button" id="settingsCancel">Annulla</button>
      <button class="primary">Salva</button>
    </div>
  </form>
</dialog>

<script>
const KEY = "smart-presenza-v1";
const $ = id => document.getElementById(id);
let data = {};
try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };

// Nome e cognome, salvati a parte rispetto ai giorni
const PROFILE_KEY = "smart-presenza-profilo";
let profilo = { nome: "", cognome: "" };
try { profilo = { ...profilo, ...JSON.parse(localStorage.getItem(PROFILE_KEY)) }; } catch (e) {}
const saveProfilo = () => { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profilo)); } catch (e) {} };

const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtLong = d => d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const TRIP = ["trasferta", "estero"];
const OFF = ["ferie", "malattia"];
const LABEL = { smart: "smart", presenza: "presenza", trasferta: "trasferta in Italia", estero: "trasferta all'estero", ferie: "ferie", malattia: "malattia" };
const TOAST = { smart: "Oggi: smart working", presenza: "Oggi: in presenza", trasferta: "Oggi: trasferta in Italia", estero: "Oggi: trasferta all'estero", ferie: "Oggi: ferie", malattia: "Oggi: malattia" };

let now = new Date();
let view = new Date(now.getFullYear(), now.getMonth(), 1);
let selected = null;
let otherOpen = false; // "Altro" aperto senza ancora aver scelto ferie o malattia

function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y) / 864e5 + 1) / 7);
}

let toastT;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600);
}

function setDay(key, mode) {
  if (mode) data[key] = mode; else delete data[key];
  save(); render();
}

function renderToday() {
  now = new Date();
  const k = iso(now), m = data[k];
  const nome = [profilo.nome, profilo.cognome].filter(Boolean).join(" ");
  $("hello").textContent = nome ? `Oggi · ${nome}` : "Oggi";
  $("today").textContent = cap(fmtLong(now));
  $("week").textContent = `Settimana ${isoWeek(now)}`;
  for (const [id, mode] of [["btnSmart", "smart"], ["btnPres", "presenza"]]) {
    const on = m === mode;
    $(id).classList.toggle("on", on);
    $(id).setAttribute("aria-pressed", on);
  }
  const trip = TRIP.includes(m), off = OFF.includes(m), other = off || otherOpen, tripOpen = trip && !other;
  renderPill("trip", m, trip, tripOpen, other);
  renderPill("other", m, off, other, tripOpen);
  $("btnOther").setAttribute("aria-expanded", other);
}

function renderPill(id, m, on, open, mini) {
  const pill = $(id), kind = $(id + "Kind");
  pill.classList.toggle("on", on);
  pill.classList.toggle("mini", mini);
  pill.querySelector(".pill-btn").setAttribute("aria-pressed", on);
  kind.hidden = !open;
  kind.querySelectorAll("button").forEach(b => {
    const sel = b.dataset.kind === m;
    b.classList.toggle("on", sel);
    b.setAttribute("aria-pressed", sel);
  });
}

function renderMonth() {
  const y = view.getFullYear(), mo = view.getMonth();
  $("monthLabel").textContent = view.toLocaleDateString("it-IT", { month: "long", year: "numeric" });

  const g = $("grid"); g.innerHTML = "";
  ["L", "M", "M", "G", "V", "S", "D"].forEach(l => { const e = document.createElement("div"); e.className = "dow"; e.textContent = l; g.appendChild(e); });
  const offset = (new Date(y, mo, 1).getDay() + 6) % 7;
  for (let i = 0; i < offset; i++) { const e = document.createElement("div"); e.className = "day empty"; g.appendChild(e); }

  const days = new Date(y, mo + 1, 0).getDate();
  const todayKey = iso(now);
  const cnt = { smart: 0, presenza: 0, trasferta: 0, estero: 0, ferie: 0, malattia: 0 };
  for (let d = 1; d <= days; d++) {
    const date = new Date(y, mo, d), k = iso(date), m = data[k];
    if (m in cnt) cnt[m]++;
    const b = document.createElement("button");
    b.className = "day";
    if (date.getDay() === 0 || date.getDay() === 6) b.classList.add("we");
    if (m) b.classList.add(m);
    if (k === todayKey) b.classList.add("today");
    if (k === selected) b.classList.add("sel");
    b.textContent = d;
    b.setAttribute("aria-label", `${fmtLong(date)}${m ? ", " + LABEL[m] : ""}`);
    b.onclick = () => { selected = selected === k ? null : k; render(); };
    g.appendChild(b);
  }
  for (const [id, m] of [["cntS", "smart"], ["cntP", "presenza"], ["cntT", "trasferta"], ["cntE", "estero"], ["cntF", "ferie"], ["cntM", "malattia"]]) $(id).textContent = cnt[m];
  const tot = Object.values(cnt).reduce((a, b) => a + b, 0);
  const pct = n => tot ? (n / tot * 100) + "%" : "0";
  $("barS").style.width = pct(cnt.smart);
  $("barP").style.width = pct(cnt.presenza);
  $("barT").style.width = pct(cnt.trasferta + cnt.estero);
  $("barO").style.width = pct(cnt.ferie + cnt.malattia);

  const has = !!selected && selected.startsWith(`${y}-${pad(mo + 1)}`);
  if (has) {
    const [yy, mm, dd] = selected.split("-").map(Number);
    const date = new Date(yy, mm - 1, dd);
    $("editDow").textContent = cap(date.toLocaleDateString("it-IT", { weekday: "long" }));
    $("editWhen").textContent = date.toLocaleDateString("it-IT", { day: "numeric", month: "short" });
  } else { $("editDow").textContent = "Scegli"; $("editWhen").textContent = "un giorno"; }
  $("editor").querySelectorAll("button").forEach(b => {
    b.disabled = !has;
    b.classList.toggle("on", has && b.dataset.set === data[selected]);
  });
}

function render() { renderToday(); renderMonth(); }

function markToday(mode) {
  const k = iso(new Date());
  otherOpen = false;
  if (data[k] === mode) { setDay(k, null); toast("Registrazione rimossa"); }
  else { setDay(k, mode); toast(TOAST[mode]); if (navigator.vibrate) navigator.vibrate(12); }
}
document.querySelectorAll(".choice").forEach(btn => btn.onclick = () => markToday(btn.dataset.mode));
// Il tasto Trasferta registra "in Italia"; se oggi è già una trasferta (di qualsiasi tipo) la toglie
// (se è ridotto a icona perché "Altro" è aperto, il primo tocco chiude Altro e lo riapre)
$("btnTrip").onclick = () => {
  const m = data[iso(new Date())];
  if (TRIP.includes(m) && otherOpen) { otherOpen = false; renderToday(); }
  else markToday(TRIP.includes(m) ? m : "trasferta");
};
// "Altro" non ha una scelta predefinita: si apre e aspetta Ferie o Malattia; se oggi è già ferie/malattia la toglie
$("btnOther").onclick = () => {
  const m = data[iso(new Date())];
  if (OFF.includes(m)) markToday(m);
  else { otherOpen = !otherOpen; renderToday(); }
};
document.querySelectorAll(".kind button").forEach(b => b.onclick = () => {
  const k = iso(new Date());
  if (data[k] !== b.dataset.kind) { setDay(k, b.dataset.kind); toast(TOAST[b.dataset.kind]); if (navigator.vibrate) navigator.vibrate(12); }
});
// Toccare l'icona già attiva cancella il giorno
$("editor").querySelectorAll("button").forEach(b => b.onclick = () => {
  const clear = data[selected] === b.dataset.set;
  setDay(selected, clear ? null : b.dataset.set);
  toast(clear ? "Giorno cancellato" : "Giorno aggiornato");
});
$("prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); selected = null; render(); };
$("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); selected = null; render(); };

$("settingsBtn").onclick = () => {
  $("nome").value = profilo.nome; $("cognome").value = profilo.cognome;
  $("settings").showModal();
};
$("settingsCancel").onclick = () => $("settings").close();
// Il form è method="dialog": l'invio chiude da solo la finestra
$("settingsForm").onsubmit = () => {
  profilo = { nome: $("nome").value.trim(), cognome: $("cognome").value.trim() };
  saveProfilo(); renderToday(); toast("Impostazioni salvate");
};

// Il backup contiene anche il profilo; l'import lo ripristina se presente
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({ ...data, profilo }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `smart-presenza-${iso(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    const ok = Object.entries(obj).filter(([k, v]) => /^\d{4}-\d{2}-\d{2}$/.test(k) && Object.hasOwn(LABEL, v));
    ok.forEach(([k, v]) => data[k] = v);
    const p = obj.profilo;
    if (p && typeof p.nome === "string" && typeof p.cognome === "string") { profilo = { nome: p.nome, cognome: p.cognome }; saveProfilo(); }
    save(); render(); toast(`Importati ${ok.length} giorni`);
  } catch (err) { toast("File non valido: serve un backup .json"); }
  e.target.value = "";
};

// Ricarica quando l'app torna in primo piano (es. il giorno dopo)
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

// Icona per la schermata Home, disegnata al volo
(function icon() {
  const c = document.createElement("canvas"); c.width = c.height = 180;
  const x = c.getContext("2d");
  x.fillStyle = "#171923"; x.fillRect(0, 0, 180, 180);
  x.fillStyle = "#4F46E5"; x.beginPath(); x.roundRect(28, 48, 58, 84, 16); x.fill();
  x.fillStyle = "#E07A1F"; x.beginPath(); x.roundRect(94, 48, 58, 84, 16); x.fill();
  $("touchIcon").href = c.toDataURL("image/png");
})();

render();
</script>
</body>
</html>
